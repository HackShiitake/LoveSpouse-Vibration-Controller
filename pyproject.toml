[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lovespouse-vibration-controller"
version = "2.0.0"
description = "Desktop GUI and local HTTP API for Bluetooth LE vibration control."
requires-python = ">=3.9"
dependencies = [
    "winsdk; platform_system == 'Windows'",
]

[project.scripts]
lovespouse-controller = "lovespouse_controller.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
